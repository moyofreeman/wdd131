<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <title>Product Review Page</title>
    <meta name="author" content="Freeman Moyo">
    <meta name="description"
        content="Submit a product review, rate its performance, record installation details, and share useful features and feedback.">

    <meta property="og:url" content="https://moyofreeman.github.io/wdd131/">
    <link rel="stylesheet" href="styles/base.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/formscript.js" defer></script>
</head>

<body>
    <header>
        <!-- <h1 contenteditable>WDD 131: Dynamic Web Fundamentals</h1> -->
        <h1 id="course-title">Product Review Form</h1>
        <nav class="navigation">
            <ul>
                <li><a href="https://www.linkedin.com/in/freemanmoyo/">LinkedIn</a></li>
                <li><a href="https://byupw.instructure.com/">I-Learn</a></li>
                <li><a href="https://www.churchofjesuschrist.org/study/scriptures">Scripture</a></li>
                <li><a href="">Final Project</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form method="get" action="review.html" id="reviewform">
            <label for="productName">Product Name</label>
            <select id="productName" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>

            </select>


            <label>Overall Rating</label>
            <div class="stars">
                <label for="onestar">
                    <input type="radio" id="onestar" name="stars" value="1" required>
                    <span>&star;</span>
                </label>
                <label for="twostar">
                    <input type="radio" id="twostar" name="stars" value="2" required>
                    <span>&star;&star;</span>
                </label>
                <label for="threestar">
                    <input type="radio" id="threestar" name="stars" value="3" required>
                    <span>&star;&star;&star;</span>
                </label>
                <label for="fourstar">
                    <input type="radio" id="fourstar" name="stars" value="4" required>
                    <span>&star;&star;&star;&star;</span>
                </label>
                <label for="fivestar">
                    <input type="radio" id="fivestar" name="stars" value="5" required>
                    <span>&star;&star;&star;&star;&star;</span>
                </label>
            </div>
            <label>Date of Installation<input type="date" id="date" name="date" required></label>

            <label>Useful Features</label>
            <label><input type="checkbox" name="durable" id="durable" value="yes">Durability</label>
            <label><input type="checkbox" name="ease" id="ease" value="yes">Ease of use</label>
            <label><input type="checkbox" name="performance" id="performance" value="yes">Performance</label>
            <label><input type="checkbox" name="design" id="design" value="yes">Design</label>

            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <label>User Name<input type="text" id="username" name="username"></label>

            <input type="submit" id="submit" value="Preview Product">

        </form>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> Moyo Freeman - Zimbabwe. All rights reserved.</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
